title = "cc-enhanced secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic Sol routing selector in retained Git history"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^docs/subscription-routing/templates/claudex$''',
  '''^docs/subscription-routing/test-client-compatibility\.sh$''',
]
regexes = ['''clodex:openai-oauth:gpt-5\.6-sol(?:=max)?''']

[[allowlists]]
description = "systemd-run option following --no-ask-password, not a credential"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''^src/memory-budget\.ts$''']
regexes = ['''^--expand-environment=no$''']
