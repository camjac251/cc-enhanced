[tools]
"github:oven-sh/bun" = "bun-v1.4.2"
lefthook = "2.2.2"

[hooks]
enter = "lefthook install"

[tasks."native:unpack"]
description = "Extract embedded JS from a native target"
usage = 'arg "[args]..." help="Arguments passed to bun run native:unpack"'
run = 'eval "set -- ${usage_args-}"; bun run native:unpack "$@"'

[tasks."native:pull"]
description = "Fetch native binary and extract clean formatted JS"
usage = 'arg "[args]..." help="Arguments passed to bun run native:pull"'
run = 'eval "set -- ${usage_args-}"; bun run native:pull "$@"'

[tasks."native:fetch"]
description = "Fetch official native Claude binary into local cache"
usage = 'arg "[args]..." help="Arguments passed to bun run native:fetch"'
run = 'eval "set -- ${usage_args-}"; bun run native:fetch "$@"'

[tasks.inspect]
description = "AST search tool with breadcrumbs, byte spans, JSON, and context"
usage = 'arg "[args]..." help="Arguments passed to bun run inspect"'
run = 'eval "set -- ${usage_args-}"; bun run inspect "$@"'

[tasks."inspect:prompts"]
description = "List prompt-like string/template nodes from a JS bundle"
usage = 'arg "[args]..." help="Arguments passed to bun run inspect -- prompts"'
run = 'eval "set -- ${usage_args-}"; bun run inspect -- prompts "$@"'

[tasks."inspect:view"]
description = "View lines from a JS file"
usage = 'arg "[args]..." help="Arguments passed to bun run inspect -- view"'
run = 'eval "set -- ${usage_args-}"; bun run inspect -- view "$@"'

[tasks.diff]
description = "Structural bundle diff between JS files"
usage = 'arg "[args]..." help="Arguments passed to bun run diff"'
run = 'eval "set -- ${usage_args-}"; bun run diff "$@"'

[tasks."lint:fix"]
description = "Auto-fix lint and format issues"
run = "bun run lint:fix"

[tasks."prompts:export"]
description = "Extract stock prompt artifacts from an explicit version or path"
usage = 'arg "[args]..." help="Arguments passed to bun run prompts:export"'
run = 'eval "set -- ${usage_args-}"; bun run prompts:export "$@"'

[tasks."harness:map"]
description = "Render an HTML map of the live harness from the newest prompt export and local config"
usage = 'arg "[args]..." help="Arguments passed to bun run harness:map"'
run = 'eval "set -- ${usage_args-}"; bun run harness:map "$@"'

[tasks."prompts:bundle"]
description = "Export prompts to a self-contained navigable bundle"
usage = 'arg "[args]..." help="Arguments passed to bun run prompts:bundle"'
run = 'eval "set -- ${usage_args-}"; bun run prompts:bundle "$@"'

[tasks."prompts:compare"]
description = "Compare two stock prompt exports"
usage = 'arg "[args]..." help="Arguments passed to bun run prompts:compare"'
run = 'eval "set -- ${usage_args-}"; bun run prompts:compare "$@"'

[tasks."prompts:compare:matrix"]
description = "Compare stock prompt exports across adjacent releases"
usage = 'arg "[args]..." help="Arguments passed to bun run prompts:compare:matrix"'
run = 'eval "set -- ${usage_args-}"; bun run prompts:compare:matrix "$@"'

[tasks.clean]
description = "Remove output directories"
run = "rm -rf versions_clean"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "bun run typecheck"

[tasks.lint]
description = "Lint project files"
run = "bun run lint"

[tasks.format]
description = "Format project files"
run = "bun run format"

[tasks.test]
description = "Run the test suite"
run = "bun run test"
