name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Record Bun version and revision
        env:
          SETUP_BUN_VERSION: ${{ steps.setup-bun.outputs.bun-version }}
          SETUP_BUN_REVISION: ${{ steps.setup-bun.outputs.bun-revision }}
        run: |
          bun_version="$(bun --version)"
          bun_revision="$(bun --revision)"
          printf 'bun --version: %s\n' "$bun_version"
          printf 'bun --revision: %s\n' "$bun_revision"
          printf 'setup-bun version: %s\n' "$SETUP_BUN_VERSION"
          printf 'setup-bun revision: %s\n' "$SETUP_BUN_REVISION"
          {
            printf '### Required Bun runtime (%s)\n\n' "$RUNNER_OS"
            printf -- "- \`bun --version\`: \`%s\`\n" "$bun_version"
            printf -- "- \`bun --revision\`: \`%s\`\n" "$bun_revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Linux memory containment
        if: runner.os == 'Linux'
        run: |
          user_id="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$user_id"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$user_id.service"
          systemctl --user show-environment >/dev/null
          {
            printf 'XDG_RUNTIME_DIR=%s\n' "$XDG_RUNTIME_DIR"
            printf 'DBUS_SESSION_BUS_ADDRESS=%s\n' "$DBUS_SESSION_BUS_ADDRESS"
          } >> "$GITHUB_ENV"

      # Formatting, types, and lint do not depend on the host, so they run once.
      - name: Check documentation formatting
        if: runner.os == 'Linux'
        run: bun run docs:check

      # The routing templates target systemd hosts, and their tests rely on
      # GNU stat, flock, and systemctl fakes.
      - name: Test subscription routing templates
        if: runner.os == 'Linux'
        run: |
          docs/subscription-routing/test-service-control.sh
          docs/subscription-routing/test-client-compatibility.sh
          docs/subscription-routing/test-prompt-composition.sh

      - name: Typecheck
        if: runner.os == 'Linux'
        run: bun run typecheck

      - name: Lint
        if: runner.os == 'Linux'
        run: bun run lint

      - name: Test
        run: bun run test
